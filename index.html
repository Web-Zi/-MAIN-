<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SALMA Admin Portal</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            salma: {
              DEFAULT: '#3B3B98',
              dark: '#2A2A72',
              gold: '#F5CD79'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen">

  <!-- Admin Header -->
  <header class="bg-salma text-white p-4 shadow-lg sticky top-0 z-40">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3 space-x-reverse">
        <div class="w-12 h-12 bg-white rounded-xl flex items-center justify-center shadow-inner overflow-hidden p-0.5">
          <img src="salma logo.png" alt="SALMA Logo" class="w-full h-full object-cover rounded-lg">
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-wide">SALMA CAFE - Admin Portal</h1>
          <p class="text-xs text-salma-gold">لوحة تحكم الإدارة ومتابعة تقارير الفروع</p>
        </div>
      </div>
      <button onclick="toggleDarkMode()" id="darkModeBtn" class="p-2 bg-salma-dark rounded-lg">🌙</button>
    </div>
  </header>

  <!-- Main Portal Layout -->
  <main class="max-w-6xl mx-auto p-4 space-y-6">

    <!-- Reports Section Header & Bulk Delete Controls -->
    <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl shadow-md flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <h2 class="text-lg font-bold text-salma dark:text-salma-gold">تقارير الجرد المستلمة من الفروع</h2>
        <p class="text-xs text-gray-500 dark:text-gray-400">عرض جميع التقارير المرسلة وتصفيتها أو حذفها</p>
      </div>

      <div class="flex items-center gap-2 flex-wrap">
        <!-- Toggle Multi-Select Mode Button -->
        <button id="toggleSelectionBtn" onclick="toggleSelectionMode()" class="px-4 py-2 border border-salma text-salma dark:text-salma-gold rounded-xl text-sm font-bold hover:bg-salma/10 transition">
          ☑️ تحديد وإزالة التقارير
        </button>
        <button onclick="loadReports()" class="px-4 py-2 bg-salma text-white rounded-xl text-sm font-bold shadow hover:bg-salma-dark transition flex items-center gap-1">
          🔄 تحديث القائمة
        </button>
      </div>
    </div>

    <!-- Selection Bar (Only visible when selection mode is active) -->
    <div id="selectionActionBar" class="hidden bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900 p-3 rounded-xl flex items-center justify-between">
      <div class="flex items-center gap-3">
        <label class="flex items-center gap-2 text-sm font-bold cursor-pointer">
          <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this.checked)" class="w-4 h-4 accent-red-600 rounded">
          تحديد الكل
        </label>
        <span id="selectedCountBadge" class="text-xs bg-red-600 text-white font-bold px-2 py-0.5 rounded-full">0 محدد</span>
      </div>
      <button onclick="deleteSelectedReports()" class="bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-1.5 rounded-lg text-sm shadow transition">
        🗑️ حذف المحدد
      </button>
    </div>

    <!-- Reports Cards Grid -->
    <div id="reportsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- Dynamic Report Cards -->
    </div>
  </main>

  <!-- Report Details Modal -->
  <div id="reportModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
    <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl max-w-3xl w-full max-h-[90vh] overflow-y-auto shadow-2xl">
      <div class="flex justify-between items-center border-b pb-3 mb-4">
        <div>
          <h3 id="modalReportTitle" class="font-bold text-lg text-salma dark:text-salma-gold">تفاصيل التقرير</h3>
          <p id="modalReportMeta" class="text-xs text-gray-500"></p>
        </div>
        <button onclick="closeReportModal()" class="text-gray-500 hover:text-gray-700 font-bold text-xl">&times;</button>
      </div>

      <div class="w-full overflow-x-auto">
        <table class="w-full text-right border-collapse text-sm">
          <thead>
            <tr class="bg-salma text-white">
              <th class="p-2 border border-salma-dark">القسم</th>
              <th class="p-2 border border-salma-dark">الصنف</th>
              <th class="p-2 border border-salma-dark">المستلم</th>
              <th class="p-2 border border-salma-dark">الجديد</th>
              <th class="p-2 border border-salma-dark">المسلم</th>
              <th class="p-2 border border-salma-dark">العدد</th>
              <th class="p-2 border border-salma-dark">الملاحظات</th>
            </tr>
          </thead>
          <tbody id="modalTableBody" class="divide-y divide-gray-200 dark:divide-gray-700">
            <!-- Details Inserted via JS -->
          </tbody>
        </table>
      </div>

      <div class="flex justify-end gap-2 mt-6">
        <button onclick="closeReportModal()" class="px-5 py-2 bg-gray-200 dark:bg-gray-700 rounded-xl font-bold">إغلاق</button>
      </div>
    </div>
  </div>

  <script>
    // --- Firebase Setup ---
    const firebaseConfig = {
      apiKey: "AIzaSyApjPEfBwq7dRy8MPgC8eiQ8U1hhkiBZXQ",
      authDomain: "salmacafe-b9e81.firebaseapp.com",
      projectId: "salmacafe-b9e81",
      storageBucket: "salmacafe-b9e81.firebasestorage.app",
      messagingSenderId: "624228348063",
      appId: "1:624228348063:web:4e0f3e18497eba2909b2aa",
      measurementId: "G-FL6F3K4MZ4"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let reportsList = [];
    let isSelectionMode = false;
    let selectedReportIds = new Set();

    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      document.getElementById('darkModeBtn').innerText = isDark ? '☀️' : '🌙';
    }

    // Fetch reports real-time or on manual reload
    function loadReports() {
      db.collection("reports").orderBy("createdAt", "desc").onSnapshot(snapshot => {
        reportsList = [];
        snapshot.forEach(doc => {
          reportsList.push({ id: doc.id, ...doc.data() });
        });
        renderReportsGrid();
      }, err => {
        console.error(err);
        alert('حدث خطأ في استدعاء التقارير من قاعدة البيانات');
      });
    }

    // Toggle multi-select delete mode
    function toggleSelectionMode() {
      isSelectionMode = !isSelectionMode;
      selectedReportIds.clear();
      
      const btn = document.getElementById('toggleSelectionBtn');
      const bar = document.getElementById('selectionActionBar');
      
      if (isSelectionMode) {
        btn.innerText = '❌ إلغاء التحديد';
        btn.className = 'px-4 py-2 bg-red-100 text-red-600 border border-red-300 rounded-xl text-sm font-bold transition';
        bar.classList.remove('hidden');
      } else {
        btn.innerText = '☑️ تحديد وإزالة التقارير';
        btn.className = 'px-4 py-2 border border-salma text-salma dark:text-salma-gold rounded-xl text-sm font-bold hover:bg-salma/10 transition';
        bar.classList.add('hidden');
      }
      
      updateSelectedCount();
      renderReportsGrid();
    }

    function toggleSelectReport(id, checked) {
      if (checked) {
        selectedReportIds.add(id);
      } else {
        selectedReportIds.delete(id);
      }
      updateSelectedCount();
    }

    function toggleSelectAll(checked) {
      selectedReportIds.clear();
      if (checked) {
        reportsList.forEach(r => selectedReportIds.add(r.id));
      }
      updateSelectedCount();
      renderReportsGrid();
    }

    function updateSelectedCount() {
      document.getElementById('selectedCountBadge').innerText = `${selectedReportIds.size} محدد`;
      document.getElementById('selectAllCheckbox').checked = reportsList.length > 0 && selectedReportIds.size === reportsList.length;
    }

    function renderReportsGrid() {
      const grid = document.getElementById('reportsGrid');
      grid.innerHTML = '';

      if (reportsList.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400 font-bold">لا توجد تقارير متاحة حالياً</div>`;
        return;
      }

      reportsList.forEach(report => {
        const isChecked = selectedReportIds.has(report.id);
        const card = document.createElement('div');
        card.className = `bg-white dark:bg-gray-800 p-5 rounded-2xl shadow-md border transition relative ${report.reviewed ? 'border-green-500/30' : 'border-amber-500/50'}`;

        card.innerHTML = `
          <div class="flex justify-between items-start mb-3">
            <div class="flex items-center gap-3">
              ${isSelectionMode ? `
                <input type="checkbox" onchange="toggleSelectReport('${report.id}', this.checked)" ${isChecked ? 'checked' : ''} class="w-5 h-5 accent-red-600 rounded cursor-pointer">
              ` : ''}
              <div>
                <h3 class="font-bold text-gray-900 dark:text-white">${report.branchName || 'فرع غير مسمى'}</h3>
                <p class="text-xs text-gray-400">📅 ${report.date || '-'} | 🕒 ${report.time || '-'}</p>
              </div>
            </div>
            <span class="text-xs px-2.5 py-1 rounded-full font-bold ${report.reviewed ? 'bg-green-100 text-green-700 dark:bg-green-950 dark:text-green-300' : 'bg-amber-100 text-amber-700 dark:bg-amber-950 dark:text-amber-300'}">
              ${report.reviewed ? 'مراجَع ✓' : 'جديد ⏳'}
            </span>
          </div>

          <p class="text-xs text-gray-500 dark:text-gray-400 mb-4">📞 هاتف الفرع: ${report.branchPhone || '-'}</p>

          <div class="flex gap-2">
            <button onclick="viewReportDetails('${report.id}')" class="flex-1 bg-salma text-white py-2 rounded-xl text-xs font-bold hover:bg-salma-dark transition">
              🔍 عرض التقرير
            </button>
            <button onclick="toggleReviewedStatus('${report.id}', ${!report.reviewed})" class="px-3 py-2 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-xl text-xs font-bold hover:bg-gray-200 transition">
              ${report.reviewed ? 'إلغاء المراجعة' : 'تحديد كمراجع'}
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function toggleReviewedStatus(id, newStatus) {
      try {
        await db.collection("reports").doc(id).update({ reviewed: newStatus });
      } catch (err) {
        console.error(err);
        alert('تعذر تحديث حالة التقرير');
      }
    }

    function viewReportDetails(id) {
      const report = reportsList.find(r => r.id === id);
      if (!report) return;

      document.getElementById('modalReportTitle').innerText = `تقرير فرع: ${report.branchName}`;
      document.getElementById('modalReportMeta').innerText = `التاريخ: ${report.date} | الوقت: ${report.time} | الهاتف: ${report.branchPhone}`;

      const tbody = document.getElementById('modalTableBody');
      tbody.innerHTML = '';

      if (report.tableData && Array.isArray(report.tableData)) {
        report.tableData.forEach(row => {
          const tr = document.createElement('tr');
          tr.className = "hover:bg-gray-50 dark:hover:bg-gray-750";
          tr.innerHTML = `
            <td class="p-2 border font-bold text-salma dark:text-salma-gold">${row.category || '-'}</td>
            <td class="p-2 border font-medium">${row.item || '-'}</td>
            <td class="p-2 border text-center">${row.mustalam}</td>
            <td class="p-2 border text-center">${row.jadid}</td>
            <td class="p-2 border text-center">${row.musallam}</td>
            <td class="p-2 border text-center font-bold text-salma dark:text-salma-gold">${row.count}</td>
            <td class="p-2 border text-gray-500">${row.note}</td>
          `;
          tbody.appendChild(tr);
        });
      }

      document.getElementById('reportModal').classList.remove('hidden');
    }

    function closeReportModal() {
      document.getElementById('reportModal').classList.add('hidden');
    }

    // Bulk Delete Selected Reports
    async function deleteSelectedReports() {
      if (selectedReportIds.size === 0) {
        alert('يرجى تحديد تقرير واحد على الأقل للحذف!');
        return;
      }

      if (!confirm(`هل أنت تأكد من إزالة (${selectedReportIds.size}) تقارير بشكل نهائي من قاعدة البيانات؟`)) {
        return;
      }

      try {
        const batch = db.batch();
        selectedReportIds.forEach(id => {
          const docRef = db.collection("reports").doc(id);
          batch.delete(docRef);
        });

        await batch.commit();
        alert('تم حذف التقارير المحددة بنجاح!');
        selectedReportIds.clear();
        updateSelectedCount();
      } catch (err) {
        console.error(err);
        alert('حدث خطأ أثناء عملية الحذف السحابي!');
      }
    }

    // Init
    loadReports();
  </script>
</body>
</html>
