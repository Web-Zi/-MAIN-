<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Main-SALMA - لوحة استقبال التقارير</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            salma: {
              DEFAULT: '#3B3B98',
              dark: '#2A2A72',
              gold: '#F5CD79'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen">

  <!-- Header -->
  <header class="bg-salma text-white p-4 shadow-lg sticky top-0 z-40">
    <div class="max-w-xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3 space-x-reverse">
        <div class="w-10 h-10 bg-white rounded-full p-1 flex items-center justify-center">
          <span class="text-salma font-bold text-lg">M</span>
        </div>
        <div>
          <h1 class="text-lg font-bold">Main-SALMA</h1>
          <p class="text-xs text-salma-gold">مركز استقبال تقارير الجرد</p>
        </div>
      </div>
      <button onclick="toggleDarkMode()" class="p-2 bg-salma-dark rounded-lg">🌙</button>
    </div>
  </header>

  <!-- Reports Container -->
  <main class="max-w-xl mx-auto p-4">
    <h2 class="text-md font-bold mb-4 text-gray-600 dark:text-gray-300">التقارير الواردة حديثاً</h2>
    <div id="reportsList" class="space-y-4">
      <!-- Dynamic Reports Cards inserted here -->
    </div>
  </main>

  <script>
    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
    }

    function loadReports() {
      const reports = JSON.parse(localStorage.getItem('salma_reports') || '[]');
      const container = document.getElementById('reportsList');
      
      if (reports.length === 0) {
        container.innerHTML = `<div class="text-center p-8 text-gray-400">لا توجد تقارير واردة حتى الآن</div>`;
        return;
      }

      container.innerHTML = '';
      reports.reverse().forEach((rep, idx) => {
        const card = document.createElement('div');
        card.className = `p-4 rounded-xl shadow-md border bg-white dark:bg-gray-800 ${rep.reviewed ? 'border-green-500 opacity-80' : 'border-salma'}`;
        card.innerHTML = `
          <div class="flex justify-between items-start mb-2">
            <div>
              <h3 class="font-bold text-lg text-salma dark:text-salma-gold">فرع: ${rep.branchName}</h3>
              <p class="text-xs text-gray-500 dark:text-gray-400">رقم الهاتف: ${rep.branchPhone}</p>
            </div>
            <span class="text-xs bg-salma/10 text-salma dark:text-salma-gold px-2 py-1 rounded font-bold">
              📅 ${rep.date} | ⏰ ${rep.time}
            </span>
          </div>
          
          <div class="flex items-center justify-between mt-4 border-t pt-3 border-gray-100 dark:border-gray-700">
            <label class="flex items-center space-x-2 space-x-reverse cursor-pointer">
              <input type="checkbox" ${rep.reviewed ? 'checked' : ''} onchange="toggleReview(${rep.id})" class="w-5 h-5 text-salma rounded">
              <span class="text-sm font-semibold">تمت المراجعة والتدقيق</span>
            </label>

            <button onclick="openPDF('${rep.fileName}')" class="bg-salma text-white px-3 py-1.5 rounded-lg text-sm flex items-center gap-1 hover:bg-salma-dark">
              <span>📄</span> فتح التقرير
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleReview(id) {
      let reports = JSON.parse(localStorage.getItem('salma_reports') || '[]');
      reports = reports.map(r => r.id === id ? { ...r, reviewed: !r.reviewed } : r);
      localStorage.setItem('salma_reports', JSON.stringify(reports));
      loadReports();
    }

    function openPDF(fileName) {
      alert(`جاري فتح وتحميل الملف: ${fileName}`);
    }

    // Listen to real-time incoming reports from App 1
    const bc = new BroadcastChannel('salma_reports');
    bc.onmessage = (event) => {
      loadReports();
    };

    // Initial Load
    loadReports();
  </script>
</body>
</html>
